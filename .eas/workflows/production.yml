# Builds the App Store version and sends it to TestFlight on every push to master
# (a merged develop → master PR). Runs on EAS under the project's owner.
name: Production iOS

on:
  push:
    branches: ['master']

# The submit job installs node_modules too but never reads eas.json, so it needs
# the same Node and Yarn as the build profile's `base` (package.json `engines`).
defaults:
  tools:
    node: 24.22.1
    yarn: 1.22.22

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
