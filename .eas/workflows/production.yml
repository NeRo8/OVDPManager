# Builds the App Store version and sends it to TestFlight on every push to master
# (a merged develop → master PR). Runs on EAS under the project's owner.
name: Production iOS

on:
  push:
    branches: ['master']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
